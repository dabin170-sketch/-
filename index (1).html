  ];
  j.tasks.forEach((t, i) => L.push([j.emoji, t.doneText, t.service ? 's' : '', t.service ? n('service') : 0,
    () => sceneWork(job, { expr: 'joy', pose: 'cheer', customer: !!t.service, custExpr: 'joy', custPose: 'wave', drink: job === 'cafe', sparkles: true, heart: !!t.service, custSmile: !!t.service })]));
  L.push(['🙌', '맡은 일을 끝까지 해냈어요.', 'p', n('work'), () => sceneWork(job, { expr: 'proud', pose: 'cheer', sparkles: true })]);
  L.push(['🤝', '힘들어하는 동료를 도와 함께 일했어요.', 's', n('cowork') + n('helpcheck'), () => sceneWork(job, { coworker: true, pile: 'small', expr: 'joy', pose: 'cheer', cwExpr: 'joy', cwPose: 'cheer', heart: true })]);
  L.push(['🏠', '퇴근을 기록했어요.', 'p', n('checkout'), () => sceneClock(job, 'out', true)]);
  L.push(['💰', `급여 ${won(state.wage.amount)}을 받았어요.`, 'e', n('wage'), () => sceneWage(true, walletScale(WAGE), walletScale(WAGE))]);
  L.push(['🍽', bought.length ? `${bought.join('와 ')}에 ${won(sp.spent)}을 썼어요.` : '오늘은 돈을 쓰지 않기로 했어요.', 'e', n('spend'), () => sceneShop(sp.buy, 0, walletScale(sp.saved), walletScale(sp.saved), true)]);
  L.push(['🐷', `남은 ${won(sp.saved)}을 저축했어요.`, 'e', n('save'), () => sceneShop(sp.buy, sp.saved, 0.55, 0.55, false)]);
  L.push(['💭', `오늘 하루를 돌아봤어요. ${P[r.personal] || ''}`, 'p', n('reflect'), () => sceneReflect(0)]);
  return L;
}

/* 엔딩: 오늘 있었던 일 그림 슬라이드 */
const slides = { list: [], i: 0, timer: null, playing: true };
function slidesStop() { clearTimeout(slides.timer); slides.timer = null; }
function slidesStart() {
  slides.list = dayTimeline(); slides.i = 0; slides.playing = !settings.reduceMotion;
  showSlide(0, true);
}
function slidesSchedule() {
  slidesStop();
  if (slides.playing) slides.timer = setTimeout(() => { if (state.chapter === 'ending') showSlide((slides.i + 1) % slides.list.length); }, 4200);
}
function showSlide(i, first) {
  const box = document.getElementById('dayShow'); if (!box) return slidesStop();
  slides.i = i;
  const [emo, text, v, n, art] = slides.list[i];
  box.querySelector('.ds-art').innerHTML = art();
  box.querySelector('.ds-cap').innerHTML = `<span class="ds-num">${i + 1}<small>/${slides.list.length}</small></span><span class="ds-emo" aria-hidden="true">${emo}</span><span class="ds-text">${text}</span>${v ? `<span class="tl-tag t-${v}">${VALUES[v].short} +${n}</span>` : ''}`;
  const st = box.querySelector('.ds-stage'); st.classList.remove('ds-in'); void st.offsetWidth; st.classList.add('ds-in');
  box.querySelectorAll('.ds-dots button').forEach((d, k) => { d.classList.toggle('on', k === i); d.setAttribute('aria-current', k === i ? 'true' : 'false'); });
  const pb = box.querySelector('[data-act="slideToggle"]'); if (pb) pb.innerHTML = slides.playing ? '⏸ 멈춤' : '▶ 자동 넘기기';
  slidesSchedule();
}

/* ---------- 렌더 ---------- */
let lastKey = null;
const hist = []; // 뒤로가기용 화면 기록
const NO_HIST = new Set(['slidePrev', 'slideNext', 'slideGo', 'slideToggle', 'valInfo', 'back', 'home', 'homeGo', 'restart', 'help', 'howto', 'teacher', 'settings', 'closeModal', 'setOpt', 'tjump', 'printT', 'sayAgain']);
function render() {
  const sc = SCENES[state.chapter]();
  const changed = sc.key !== lastKey;
  const active = document.activeElement;
  const fk = active && active.dataset ? active.dataset.fk : null;
  const screen = document.getElementById('screen');
  const layout = sc.layout || 'split';
  screen.className = `screen layout-${layout}${changed ? ' enter' : ''}`;
  screen.innerHTML = (layout === 'wide' || layout === 'ending')
    ? `<section class="panel card">${sc.panel}</section>`
    : `<figure class="art card">${sc.art}</figure><section class="panel card">${sc.panel}</section>`;
  if (flyReq) { const v = flyReq; flyReq = null; requestAnimationFrame(() => flyMoney(v)); }
  if (state.chapter === 'ending') slidesStart(); else slidesStop();
  const onTitle = state.chapter === 'title';
  document.getElementById('homeBtn').hidden = onTitle;
  const bb = document.getElementById('backBtn'); bb.hidden = onTitle; bb.disabled = !hist.length;
  if (changed) {
    if (sc.key === 'commute-greeted') speak(COWORKER_HELLO);
    else if (sc.key === 'cowork-done') speak(coworkVoice());
    else if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) { } }
    lastKey = sc.key;
    window.scrollTo({ top: 0, behavior: settings.reduceMotion ? 'auto' : 'smooth' });
    const t = document.getElementById('scene-title');
    if (t && state.chapter !== 'title') t.focus({ preventScroll: true });
  } else if (fk) {
    const el = screen.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
    if (el && !el.disabled) el.focus({ preventScroll: true });
    else { const n = screen.querySelector('[data-act="next"], .actions .btn:not([disabled])'); if (n) n.focus({ preventScroll: true }); }
  }
}

/* ---------- 질문 처리 ---------- */
function currentQuestion() {
  if (state.chapter === 'work' && !state.work.complete) return JOBS[state.job].tasks[state.work.task].q;
  return null;
}

/* ---------- 동작 ---------- */
const go = (ch) => { state.chapter = ch; resetUI(); };
const actions = {
  start() { go('job'); },
  startGo() { closeModal(); go('job'); },
  pickJob(v) { if (JOBS[v] && state.jobView === 'pick') state.ui.jobPick = v; },
  confirmJob() {
    if (!state.ui.jobPick || state.jobView !== 'pick') return;
    state.job = state.ui.jobPick; state.jobView = 'accept'; award('accept');
  },
  toCommute() { if (state.job && state.jobView === 'accept') go('commute'); },
  payBus() {
    const c = state.commute; if (c.paid) return;
    c.paid = true; c.phase = 'arrived'; state.money.wallet -= BUS_FARE; award('bus');
  },
  clockIn() { const c = state.commute; if (c.phase === 'arrived' && !c.clockIn) { c.clockIn = true; c.phase = 'greet'; award('clockin'); } },
  back() {
    if (!hist.length) return false;
    timers.forEach(clearTimeout); timers = []; clearFx();
    state = JSON.parse(hist.pop()); lastKey = null;
    updateHUD(); render(); return false;
  },
  greet(v) { const c = state.commute; if (c.phase !== 'greet' || c.greet) return; c.greet = v; award('greet'); },
  toWork() { if (state.commute.greet) go('work'); },
  slidePrev() { slides.playing = false; showSlide((slides.i - 1 + slides.list.length) % slides.list.length); return false; },
  slideNext() { slides.playing = false; showSlide((slides.i + 1) % slides.list.length); return false; },
  slideGo(v) { slides.playing = false; showSlide(+v); return false; },
  slideToggle() { slides.playing = !slides.playing; showSlide(slides.i); return false; },
  valInfo(val) { const [v, kind] = String(val).split(':'); openModal('vinfo', null, { v, kind }); return false; },
  sayAgain(v) { speak(v === 'cowork' ? coworkVoice() : COWORKER_HELLO); return false; },
  answer(v) {
    const q = currentQuestion(); if (!q || state.ui.solved) return;
    const o = q.options.find(x => x.id === v); if (!o) return;
    if (o.correct) {
      state.ui.solved = true; state.ui.hint = false; state.ui.lastWrong = [];
      state.ui.fb = { type: 'good', text: q.good };
      const w = state.work, t = JOBS[state.job].tasks[w.task];
      w.done[w.task] = true;
      if (t.service) { w.service = true; award('service'); }
    } else {
      state.ui.wrong++; state.ui.lastWrong = [o.id];
      state.ui.fb = { type: 'hint', text: o.why || q.hint };
      if (state.ui.wrong >= 2) { state.ui.hint = true; state.ui.fb.text += ' 반짝이는 카드를 눌러 보세요.'; }
    }
  },
  next() {
    if (!state.ui.solved || state.chapter !== 'work') return;
    const w = state.work; resetUI();
    if (w.task < JOBS[state.job].tasks.length - 1) w.task++;
    else { w.complete = true; award('work'); }
  },
  toCowork() { if (state.work.complete) go('cowork'); },
  cowork(v) { if (state.cowork.done) return; state.cowork.choice = v; state.cowork.done = true; state.cowork.helpChecked = true; award('cowork'); award('helpcheck'); },
  clockOut() {
    const c = state.checkout; if (c.clockOut || !state.cowork.done) return;
    c.clockOut = true; c.sub = 'wage'; go('checkout'); moneyRain(); award('checkout');
  },
  getWage() {
    if (state.wage.received || !state.checkout.clockOut) return;
    state.wage.received = true; state.wage.amount = WAGE; state.money.wallet += WAGE;
    fx({ type: 'wage', amount: WAGE }); award('wage');
  },
  toSpend() { if (state.wage.received) { walletPrev = 1.6; go('spend'); } },
  buy(v) { const sp = state.spend; if (sp.done || !(v in sp.buy)) return; sp.buy[v] = !sp.buy[v]; lastBuy = { k: v, on: sp.buy[v] }; if (sp.buy[v]) flyReq = v; },
  finishPlan() {
    const sp = state.spend; if (sp.done || !state.wage.received) return;
    sp.spent = totalSpent(); sp.saved = WAGE - sp.spent; sp.done = true; sp.view = 'saved';
    state.money.wallet -= WAGE; state.money.savings += sp.saved;
    const names = Object.keys(ITEMS).filter(k => sp.buy[k]).map(k => ITEMS[k].name);
    award('spend', names.length ? `${names.join('와 ')}에 ${won(sp.spent)}을 사용했어요!` : '오늘은 쓰지 않고 모으기로 스스로 정했어요!');
    award('save', `남은 ${won(sp.saved)}을 저축했어요!`);
  },
  toReflect() { if (state.spend.done) go('reflect'); },
  reflectPick(v) {
    const r = state.reflect, key = ['personal', 'social', 'economic'][r.step];
    if (key === 'personal') r.personal = v;
    else { const a = r[key], i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); }
  },
  reflectNext() {
    const r = state.reflect, key = ['personal', 'social', 'economic'][r.step];
    const has = key === 'personal' ? !!r.personal : r[key].length > 0;
    if (!has) return;
    if (r.step < 2) r.step++;
    else { r.done = true; award('reflect'); go('ending'); }
  },
  restart() {
    timers.forEach(clearTimeout); timers = [];
    clearFx();
    state = freshState(); lastKey = null; hist.length = 0; walletPrev = 0.55;
    updateHUD();
  },
  howto() { openModal('howto'); return false; },
  teacher() { openModal('teacher'); return false; },
  help() {
    const q = currentQuestion();
    if (q && !state.ui.solved) { state.ui.hint = true; state.ui.fb = { type: 'hint', text: q.hint + ' 반짝이는 카드를 눌러 보세요.' }; render(); }
    openModal('help'); return false;
  },
  home() { if (state.chapter === 'title') return false; openModal('home'); return false; },
  homeGo() { closeModal(); actions.restart(); },
  tjump(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: settings.reduceMotion ? 'auto' : 'smooth', block: 'start' }); return false; },
  printT() { window.print(); return false; },
  settings() { openModal('settings'); return false; },
  closeModal() { closeModal(); return false; },
  setOpt(v) { settings[v] = !settings[v]; applySettings(); openModal('settings', v === 'reduceMotion' ? 'set:rm' : 'set:bt'); return false; },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  const snap = NO_HIST.has(el.dataset.act) ? null : JSON.stringify(state);
  const prevKey = lastKey;
  const r = fn(el.dataset.val);
  if (r !== false) render();
  if (snap && lastKey !== prevKey) { hist.push(snap); if (hist.length > 60) hist.shift(); document.getElementById('backBtn').disabled = false; }
});
document.getElementById('fx').addEventListener('click', () => nextFx());
document.addEventListener('keydown', (e) => {
  if (fxOn && ['Enter', ' ', 'Escape'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); nextFx(); return; }
  const m = document.getElementById('modal');
  if (m.hidden) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Tab') {
    const f = [...m.querySelectorAll('button, summary, [href], input, textarea')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
}, true);

function openModal(name, focusFk, opts) {
  const m = document.getElementById('modal');
  if (m.hidden) modalReturn = document.activeElement;
  const d = MODALS[name](opts);
  const keep = !m.hidden && m.dataset.name === name;
  m.dataset.name = name;
  m.querySelector('.modal-box').className = 'modal-box' + (d.wide ? ' wide' : '');
  m.querySelector('#modal-title').textContent = d.title;
  m.querySelector('.modal-body').innerHTML = d.body;
  m.querySelector('.modal-foot').innerHTML = d.foot || '';
  m.hidden = false;
  document.body.classList.add('modal-open');
  if (!keep) { m.querySelector('.modal-body').scrollTop = 0; (m.querySelector('.modal-foot .btn-primary') || m.querySelector('.modal-close')).focus(); }
  else { const f = focusFk && m.querySelector(`[data-fk="${focusFk}"]`); if (f) f.focus(); }
}
function closeModal() {
  const m = document.getElementById('modal');
  if (m.hidden) return;
  m.hidden = true; document.body.classList.remove('modal-open');
  if (modalReturn && document.contains(modalReturn)) modalReturn.focus();
}

      <li><b>← 뒤로가기</b>: 바로 앞 화면으로 돌아갑니다. 그 화면에서 얻은 점수와 돈도 함께 되돌아가므로, 다시 하면 똑같이 다시 받습니다.</li>
      <li><b>패널 위 작은 표시(예: 3단계 · 출근)</b>: 지금이 몇 번째 단계인지 알려 줍니다.</li>
      <li><b>돈 계산</b>: 기본금, 버스 요금, 급여, 저축은 화면에 따로 표시하지 않고 게임 안에서 계산되며, 급여 받기·소비·저축 화면과 엔딩에서 확인할 수 있습니다.</li>
      <li><b>🏠 처음으로</b>: 확인창에서 [네]를 누르면 모든 기록이 지워지고 처음 화면으로 돌아갑니다.</li>
      <li><b>💡 도움말</b>: 지금 할 일을 알려 주고, 문제 화면에서는 정답 카드를 반짝이게 합니다. 감점은 없습니다.</li>
      <li><b>가운데 가치 카드</b>: 가치가 오를 때마다 나타나며 3초 뒤 저절로 닫히거나, 화면을 누르거나 Enter를 누르면 닫힙니다.</li></ul>
    <p><b>③ 단계별 진행</b></p>
    <div class="t-table-wrap"><table class="t-table"><thead><tr><th>단계</th><th>학생 조작</th><th>화면에서 일어나는 일</th><th>오르는 가치</th><th>교사 지원</th><th>시간</th></tr></thead>
      <tbody>${flow.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p><b>④ 지도 형태 제안</b></p><ul>
      <li><b>시범 → 함께 → 혼자</b>: 1회차는 교사가 직업 하나로 시범, 2회차는 학생이 조작하고 교사가 발문, 3회차는 다른 직업으로 학생 혼자 진행합니다.</li>
      <li><b>짝 활동</b>: 한 명은 화면 조작, 한 명은 문장 읽기를 맡고 직업을 바꿀 때 역할을 바꿉니다.</li></ul>
    <p><b>⑤ 학생 특성별 지원</b></p><ul>
      <li>읽기가 어려운 학생: 교사가 질문과 선택지를 읽어 주고, 그림 카드를 손가락으로 가리키며 고르게 합니다.</li>
      <li>소근육 조작이 어려운 학생: 터치 대신 키보드(Tab으로 이동, Enter로 선택)를 사용할 수 있습니다.</li>
      <li>주의 집중이 어려운 학생: [움직임 줄이기]를 켜고, 한 단계가 끝날 때마다 상태창의 변화를 함께 확인합니다.</li>
      <li>저시력 학생: [글자 크게]를 켜고, 필요하면 브라우저 확대(Ctrl +)를 함께 사용합니다.</li></ul></section>

  <section class="t-sec" id="t-concept"><h3>개념 설명</h3>
    <p class="tiny" style="margin-bottom:8px">게임 속 엔딩 화면은 아래 '학생용 쉬운 말' 기준으로 설명합니다.</p>
    ${concept('p', [['뜻', '일을 통해 <b>자기 자신</b>이 얻는 의미. 성취감, 자신감, 자아존중감, 능력 발휘와 성장, 보람 등이 해당합니다.'], ['학생용 쉬운 말', '"일을 하면서 내 마음이 자라는 것" · 나에게 좋은 점'], ['게임 속 장면', '합격, 스스로 출근 기록, 먼저 인사하기, 업무 완료, 퇴근 마무리, 하루 돌아보기'], ['생활 속 예', '처음 해 본 일을 끝까지 해냈을 때 뿌듯함, 칭찬을 듣고 자신감이 생김'], ['지도 유의점', '점수의 높고 낮음이 아니라 "어떤 순간에 기분이 좋았는지"를 말하게 합니다.']])}
    ${concept('s', [['뜻', '일을 통해 <b>다른 사람과 사회</b>에 기여하는 의미. 타인을 돕는 것, 동료와 협력하는 것, 공동체의 한 사람으로 역할을 맡고 소속감을 느끼는 것이 해당합니다.'], ['학생용 쉬운 말', '"내가 한 일이 다른 사람을 돕는 것" · 다른 사람에게 좋은 점'], ['게임 속 장면', '손님·이용자 돕기, 동료와 함께 정리하기, 내 일이 손님·동료·우리 동네를 돕는다는 것 확인하기'], ['생활 속 예', '카페 직원 덕분에 음료를 마심, 도서관 직원 덕분에 책을 찾음, 마트 직원 덕분에 장을 봄'], ['지도 유의점', '"누가 고마워했을까요?"처럼 도움을 받은 사람을 구체적으로 떠올리게 합니다.']])}
    ${concept('e', [['뜻', '일의 대가로 <b>소득(급여)</b>을 얻어 생활을 유지하고, 소비와 저축을 하며 경제적으로 자립해 가는 의미입니다.'], ['학생용 쉬운 말', '"일을 하고 받은 돈으로 생활하는 것" · 생활에 좋은 점'], ['게임 속 장면', '내 돈으로 버스 요금 내기, 급여 받기, 식사·여가에 돈 쓰기, 남은 돈 저축하기'], ['생활 속 예', '교통비·식비 내기, 갖고 싶은 물건을 위해 돈 모으기'], ['지도 유의점', '많이 쓰는 것이 좋다는 인상을 주지 않도록 하고, "필요한 곳에 쓰고 남은 돈은 모은다"는 흐름을 강조합니다.']])}
    <p style="margin-top:6px"><b>관련 용어</b></p>
    <div class="terms">
      <div><b>급여</b>일한 대가로 받는 돈입니다. 이 게임에서는 시급 × 일한 시간으로 계산합니다.</div>
      <div><b>시급</b>한 시간 일하고 받는 돈입니다. 게임은 2026년 최저임금 시급 ${won(HOURLY)}을 사용합니다.</div>
      <div><b>근무 시간</b>09:00~18:00 중 점심시간 1시간을 빼고 ${HOURS}시간 일한 것으로 계산합니다(${won(HOURLY)} × ${HOURS} = ${won(WAGE)}).</div>
      <div><b>출퇴근 기록</b>일을 시작하고 마친 시간을 남기는 것입니다. 일한 시간을 확인하는 근거가 됩니다.</div>
      <div><b>소비</b>필요하거나 원하는 것에 돈을 쓰는 것입니다(식사, 여가 활동, 교통비).</div>
      <div><b>저축</b>쓰지 않은 돈을 모아 두는 것입니다. 이 게임에서는 쓰고 남은 급여가 자동으로 저축됩니다.</div>
    </div></section>

  <section class="t-sec" id="t-q"><h3>챕터별 발문</h3>
    ${ch.map(([t, q, rs, f]) => `<details class="t-step"><summary>${t}</summary><p><b>발문</b> “${q}”</p><p><b>예상 반응</b></p><ul>${rs.map(x => `<li>${x}</li>`).join('')}</ul><p><b>후속 발문</b> “${f}”</p></details>`).join('')}
    <p class="tiny">예상 반응은 예시입니다. 학생의 다양한 표현을 그대로 인정하고, 게임 속 행동과 연결해 주세요.</p></section>

  <section class="t-sec" id="t-obs"><h3>관찰 평가 체크리스트</h3>
    <div class="obs-head"><label>학생 이름 <input type="text" data-obs="name" value="${esc(obs.name)}" size="10"></label><label>날짜 <input type="text" data-obs="date" value="${esc(obs.date)}" size="10" placeholder="예: 10월 13일"></label></div>
    <div class="legend-obs"><span>◎ 스스로 해요(3)</span><span>○ 도움 받아 해요(2)</span><span>△ 아직 어려워요(1)</span></div>
    <div class="t-table-wrap"><table class="t-table obs"><thead><tr><th>관찰 내용</th><th>◎ 스스로</th><th>○ 도움</th><th>△ 어려움</th></tr></thead><tbody>${obsTable}</tbody></table></div>
    <label class="tiny" for="obs-memo"><b>관찰 메모</b> (학생이 한 말, 사용한 도움, 다음 지도 계획 등)</label>
    <textarea id="obs-memo" class="obs-memo" data-obs="memo">${esc(obs.memo)}</textarea>
    <p class="tiny">'도움'은 언어적 촉진(말로 안내), 몸짓 촉진(손가락으로 가리키기), [도움말] 사용 등을 포함합니다. 표시한 내용은 이 화면을 닫아도 유지되지만, 새로 고침하면 지워지므로 [인쇄하기]로 남겨 두세요.</p></section>

  <section class="t-sec note" id="t-tip"><h3>운영 팁</h3><ul>
    <li>급여 ${won(WAGE)}은 2026년 최저임금 시급 ${won(HOURLY)} × ${HOURS}시간으로 계산한 금액입니다. 기본금 ${won(BASE_MONEY)}, 버스 요금 ${won(BUS_FARE)}, 식사·여가 가격(각 ${won(ITEMS.meal.price)})은 수업용 가상 금액입니다.</li>
    <li>점수를 합산하거나 등급을 매기지 않습니다. 끝까지 진행하면 세 가치가 모두 100점이 되며, 오답·도움말 사용·느린 진행에 감점이 없습니다.</li>
    <li>업무에서 2번 틀리면 정답 카드가 자동으로 반짝여 진행이 막히지 않습니다.</li>
    <li>가운데 가치 카드가 뜰 때 "왜 이 가치가 올랐을까요?"라고 묻고 학생이 답한 뒤 화면을 누르게 하면 개념 연결에 도움이 됩니다.</li>
    <li>[🏠 처음으로] 또는 엔딩의 [처음부터 다시 하기]로 다른 직업을 체험하게 하고, 직업마다 도움을 주는 사람이 어떻게 다른지 비교해 보세요.</li></ul></section>`;
}

/* ---------- 시작 ---------- */
function syncHudHeight() {
  const hh = document.getElementById('hud').offsetHeight;
  document.documentElement.style.setProperty('--hud-h', hh + 'px');
}
window.addEventListener('resize', syncHudHeight);
if (window.ResizeObserver) new ResizeObserver(syncHudHeight).observe(document.getElementById('hud'));
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
applySettings();
updateHUD();
render();
syncHudHeight();

</script>
</body>
</html>
