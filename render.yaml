# Render Blueprint — 무료(Free) 웹 서비스 1개만 만든다. 유료 자원은 정의하지 않는다.
services:
  - type: web
    name: life-os
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: SECRET_KEY          # 로그인 세션 서명용 — Render가 자동 생성
        generateValue: true
      - key: SETUP_CODE          # 최초 비밀번호 설정 때 입력하는 코드 — Render가 자동 생성
        generateValue: true
      - key: CRON_TOKEN          # 서버 예약 실행용 비밀 토큰 — Render가 자동 생성, GitHub 저장소 Secret에도 같은 값 등록
        generateValue: true
      - key: LIFEOS_GITHUB_REPO  # 예: myname/life-os
        sync: false
      - key: LIFEOS_GITHUB_TOKEN # 이 저장소의 Contents 읽기/쓰기 권한만 가진 세분화 토큰
        sync: false
      - key: LIFEOS_DATA_BRANCH
        value: lifeos-data
      - key: DATA_ENCRYPTION_KEY # 직접 정한 긴 문장. 잃어버리면 데이터를 열 수 없음
        sync: false
